<div class="app-shell d-flex min-vh-100" [class.app-shell--open]="menuAbierto()">
  <aside id="shell-nav" class="app-sidebar border-end d-flex flex-column" [attr.inert]="menuAbierto() ? null : ''">
    <div class="app-brand border-bottom flex-shrink-0">
      <span class="app-brand__mark">
        <img src="logo.png" alt="Sistema Bancario" width="44" height="44" />
      </span>
      <span class="app-brand__text">
        <span class="app-brand__title text-truncate">{{ panel().nombre }}</span>
        <span class="app-brand__sub text-truncate">{{ usuario()?.nombre }} {{ usuario()?.apellido }}</span>
      </span>
    </div>

    <nav class="app-nav flex-column flex-grow-1">
      <p class="app-nav__label">Módulos</p>
      @for (modulo of modulos(); track modulo.id) {
        <a
          class="app-nav__item nav-link"
          [routerLink]="modulo.ruta"
          routerLinkActive="app-nav__item--active"
          (click)="cerrarMenu()"
        >
          <ui-icon [name]="modulo.icono" [size]="18" />
          <span class="text-truncate">{{ modulo.nombre }}</span>
        </a>
      }
    </nav>

    <div class="app-sidebar__foot border-top flex-shrink-0">
      <button type="button" class="app-panel-btn" (click)="irAPaneles()">
        <ui-icon name="panel" [size]="18" />
        Cambiar de panel
      </button>
    </div>
  </aside>

  @if (menuAbierto()) {
    <div class="app-sidebar-backdrop" (click)="cerrarMenu()"></div>
  }

  <div class="d-flex flex-column flex-grow-1" style="min-width: 0">
    <header class="app-topbar navbar border-bottom">
      <button
        type="button"
        class="btn btn-link app-icon-btn flex-shrink-0"
        (click)="alternarMenu()"
        aria-label="Menú"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="shell-nav"
      >
        <span class="app-menu-icon" aria-hidden="true">
          <ui-icon class="app-menu-icon-open" name="menu" [size]="20" />
          <ui-icon class="app-menu-icon-close" name="close" [size]="20" />
        </span>
      </button>

      <nav aria-label="breadcrumb" class="d-none d-sm-block">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">Panel</li>
          <li class="breadcrumb-item active" aria-current="page">{{ panel().nombre }}</li>
        </ol>
      </nav>

      <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
        <button
          type="button"
          class="btn btn-link app-icon-btn"
          (click)="alternarTema($event)"
          aria-label="Cambiar tema"
        >
          <ui-icon [name]="tema.tema() === 'dark' ? 'sun' : 'moon'" [size]="18" />
        </button>

        @if (usuario(); as u) {
          <div class="app-user border-start">
            <span class="ui-avatar">{{ iniciales() }}</span>
            <span class="app-user__info">
              <span class="app-user__name">{{ u.nombre }} {{ u.apellido }}</span>
              <span class="app-user__mail">{{ u.email }}</span>
            </span>
          </div>
        }

        <button type="button" class="btn btn-link app-icon-btn" (click)="cerrarSesion()" aria-label="Cerrar sesión">
          <ui-icon name="logout" [size]="18" />
        </button>
      </div>
    </header>

    <main class="app-content flex-grow-1" style="min-width: 0">
      <router-outlet />
    </main>
  </div>
</div>
