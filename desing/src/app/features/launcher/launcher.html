<div class="min-vh-100 bg-body">
  <header class="launcher-topbar navbar sticky-top border-bottom px-3 px-lg-4">
    <div class="d-flex align-items-center gap-2 fw-semibold" style="min-width: 0">
      <span
        class="d-inline-flex align-items-center justify-content-center bg-white border rounded-3 p-1 flex-shrink-0"
        style="width: 34px; height: 34px"
      >
        <img src="logo.png" alt="Sistema Bancario" width="24" height="24" class="img-fluid object-fit-contain" />
      </span>
      <span class="text-truncate">Bienvenido {{ usuario()?.nombre }}</span>
    </div>

    <div class="d-flex align-items-center gap-2 gap-md-3">
      <button type="button" class="btn btn-link text-body-secondary p-2" (click)="alternarTema($event)" aria-label="Cambiar tema">
        <ui-icon [name]="tema.tema() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>

      @if (usuario(); as u) {
        <div class="d-none d-md-flex align-items-center gap-2 border-start ps-3">
          <span
            class="rounded-circle bg-body-secondary d-inline-flex align-items-center justify-content-center fw-semibold flex-shrink-0"
            style="width: 38px; height: 38px"
          >
            {{ iniciales() }}
          </span>
          <span class="d-flex flex-column lh-1" style="min-width: 0">
            <span class="small fw-semibold">{{ u.nombre }} {{ u.apellido }}</span>
            <span class="text-body-secondary" style="font-size: 0.72rem">{{ u.email }}</span>
          </span>
        </div>
      }

      <button type="button" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2" (click)="cerrarSesion()">
        <ui-icon name="logout" [size]="16" />
        Salir
      </button>
    </div>
  </header>

  <main class="container py-5" style="max-width: 1100px">
    <div class="mb-5">
      <p class="text-uppercase small fw-semibold text-body-secondary mb-0" style="letter-spacing: 0.08em">Panel de acceso</p>
      <h1 class="display-6 fw-semibold mt-2">¿A dónde quieres ir?</h1>
      <p class="fs-5 text-body-secondary mt-3 mb-0">
        Tienes acceso a <strong class="text-body">{{ accesibles() }}</strong> de {{ paneles.length }} módulos disponibles.
      </p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-3 g-lg-4">
      @for (panel of paneles; track panel.id) {
        <div class="col">
          <button
            type="button"
            class="card h-100 w-100 text-start panel-card"
            [class.panel-card--locked]="!accesible(panel)"
            [attr.aria-disabled]="!accesible(panel)"
            (click)="abrir(panel)"
          >
            <span class="card-body d-flex flex-column gap-2">
              <span class="d-flex align-items-center justify-content-between">
                <span
                  class="d-inline-flex align-items-center justify-content-center rounded-3 bg-body-secondary text-body-secondary"
                  style="width: 46px; height: 46px"
                >
                  <ui-icon [name]="panel.icono" [size]="22" />
                </span>
                @if (!accesible(panel)) {
                  <span class="text-body-secondary" title="Sin acceso"><ui-icon name="lock" [size]="16" /></span>
                } @else {
                  <span class="text-body-secondary panel-card__open"><ui-icon name="chevronRight" [size]="18" /></span>
                }
              </span>

              <span class="fs-5 fw-semibold">{{ panel.nombre }}</span>
              <span class="text-body-secondary small flex-grow-1">{{ panel.descripcion }}</span>

              <span class="mt-2">
                <span class="badge rounded-pill" [class.text-bg-success]="accesible(panel)" [class.text-bg-secondary]="!accesible(panel)">
                  <span class="d-inline-block rounded-circle me-1 align-middle" style="width: 7px; height: 7px; background: currentColor"></span>
                  {{ accesible(panel) ? 'Disponible' : 'Bloqueado' }}
                </span>
              </span>
            </span>
          </button>
        </div>
      }
    </div>
  </main>
</div>
